name: Deploy Pages

# Site = thư mục news/ (index.html, feed.xml, briefs/<DATE>.html do `news.py site` build sẵn).
on:
  push:
    branches: [main]
    paths: ["news/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: news
      # Artifact vừa upload đôi khi chưa hiện ngay (deploy-pages báo "Found 0 artifact(s)"); chờ một chút.
      - run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v5

  # deploy lỗi tạm thời (push) → tự dispatch một run mới, đúng như chạy tay `gh workflow run pages.yml`.
  # Không dùng `gh run rerun`: nó giữ artifact cũ nên dễ ra 2 artifact trùng tên. Chỉ retry khi event là push,
  # nên run do dispatch sinh ra không retry tiếp (không lặp vô hạn).
  retry:
    needs: deploy
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
