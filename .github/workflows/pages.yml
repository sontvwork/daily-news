name: Deploy Pages

# Site = thư mục news/ (index.html, feed.xml, briefs/ do `library feed` sinh ra).
on:
  push:
    branches: [main]
    paths: ["news/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: news
      - id: deployment
        uses: actions/deploy-pages@v5
